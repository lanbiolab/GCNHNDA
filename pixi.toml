[workspace]
authors = ["qinqizhou <2533863721@qq.com>"]
channels = ["conda-forge"]
name = "FREEDOM-master"
platforms = ["linux-64"]
version = "0.1.0"

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-urls = ["https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"]

[tasks]

[dependencies]
python = "3.10.*"
numpy = ">=2.2.6,<3"
scipy = ">=1.15.2,<2"
pytz = ">=2025.2,<2026"
pandas = ">=2.3.3,<3"
h5py = ">=3.15.1,<4"
openpyxl = ">=3.1.5,<4"
six = ">=1.17.0,<2"
lmdb = ">=0.9.35,<0.10"
python-lmdb = ">=1.7.5,<2"
pyyaml = ">=6.0.3,<7"
tqdm = ">=4.67.3,<5"
colorama = ">=0.4.6,<0.5"
matplotlib = ">=3.8.0,<3.9"
packaging = ">=26.0,<27"
scikit-learn = ">=1.7.2,<2"

[pypi-dependencies]
torch = ">=2.0.0"
torchvision = ">=0.15.0"
