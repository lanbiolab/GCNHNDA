# general
gpu_id: 0
use_gpu: True
seed: [999]

# multi-modal raw features
data_path: '../data/'
inter_splitting_label: 'x_label'
filter_out_cod_start_users: True
is_multimodal_model: True

checkpoint_dir: 'saved'
save_recommended_topk: True
recommend_topk: 'recommend_topk/'

embedding_size: 64
#embedding_size: 3780

# training settings
epochs: 300
stopping_step: 20
train_batch_size: 100
learner: adam
learning_rate: 0.001
learning_rate_scheduler: [1.0, 50]
eval_step: 1

training_neg_sample_num: 4              # 每个样本的负样本数量（为 Mixup 提供更多候选）
use_neg_sampling: True
use_full_sampling: False
NEG_PREFIX: neg__

# ========== 困难负样本 Mixup 配置 ==========
# use_hard_neg_mixup 在模型配置中设置
mixup_alpha_range: [0.0, 1.0]           # Mixup 混合系数范围 [min, max]，参考 SGCL

USER_ID_FIELD: user_id:token
ITEM_ID_FIELD: item_id:token
TIME_FIELD: timestamp:float
field_separator: "\t"


# evaluation settings (binary classification metrics)
metrics: ["AUC", "AUPR", "Precision", "Recall", "F1", "Accuracy"]
valid_metric: AUC
eval_batch_size: 100

#
use_raw_features: False
max_txt_len: 32
max_img_size: 256
vocab_size: 30522
type_vocab_size: 2
hidden_size: 4
pad_token_id: 0
max_position_embeddings: 512
layer_norm_eps: 1e-12
hidden_dropout_prob: 0.1

end2end: False

# iteration parameters
hyper_parameters: ["seed"]
